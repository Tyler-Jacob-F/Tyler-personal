name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # Order matters only for reading outputs; CDK sequences the deploys by dependency.
  STACKS: TheKeepData TheKeepAuth TheKeepApi TheKeepSite

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No `environment:` here on purpose: a job inside a GitHub environment presents an OIDC
    # subject of repo:<owner>/<repo>:environment:<name>, and the deploy role in
    # infra/lib/account-stack.ts trusts only repo:<owner>/<repo>:ref:refs/heads/main.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Show OIDC claims (sub, aud, repository); no token is printed
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            for (const k of ['sub', 'aud', 'repository', 'repository_owner', 'ref', 'event_name', 'iss']) {
              core.info(`${k}: ${claims[k]}`);
            }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: cdk deploy
        run: pnpm -C infra cdk deploy $STACKS --require-approval never --outputs-file outputs.json

      - name: Read stack outputs
        id: outputs
        run: |
          echo "bucket=$(jq -r '.TheKeepSite.SiteBucketName' infra/outputs.json)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(jq -r '.TheKeepSite.DistributionId' infra/outputs.json)" >> "$GITHUB_OUTPUT"
          echo "cluster_arn=$(jq -r '.TheKeepData.ClusterArn' infra/outputs.json)" >> "$GITHUB_OUTPUT"
          echo "secret_arn=$(jq -r '.TheKeepData.SecretArn' infra/outputs.json)" >> "$GITHUB_OUTPUT"
          echo "db_name=$(jq -r '.TheKeepData.DatabaseName' infra/outputs.json)" >> "$GITHUB_OUTPUT"
          echo "user_pool_id=$(jq -r '.TheKeepAuth.UserPoolId' infra/outputs.json)" >> "$GITHUB_OUTPUT"
          echo "user_pool_client_id=$(jq -r '.TheKeepAuth.UserPoolClientId' infra/outputs.json)" >> "$GITHUB_OUTPUT"

      # Pending SQL files in apps/api/migrations, through the Data API, recorded in
      # schema_migration. Wakes the cluster if it is paused.
      - name: Run migrations
        env:
          DB_CLUSTER_ARN: ${{ steps.outputs.outputs.cluster_arn }}
          DB_SECRET_ARN: ${{ steps.outputs.outputs.secret_arn }}
          DB_NAME: ${{ steps.outputs.outputs.db_name }}
        run: pnpm -C apps/api migrate

      # The SPA learns its Cognito pool and client from the stacks it just deployed.
      - name: Build web
        env:
          VITE_AWS_REGION: ${{ env.AWS_REGION }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.outputs.outputs.user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.outputs.outputs.user_pool_client_id }}
        run: pnpm -C apps/web build

      # Double sync: hashed assets are immutable for a
      # year; root files (index.html and friends) are never cached so a deploy is visible
      # on the next request.
      - name: Publish assets (immutable)
        run: |
          aws s3 sync apps/web/dist "s3://${{ steps.outputs.outputs.bucket }}" \
            --exclude "*" --include "assets/*" \
            --cache-control "public, max-age=31536000, immutable" --delete
      - name: Publish root files (no-cache)
        run: |
          aws s3 sync apps/web/dist "s3://${{ steps.outputs.outputs.bucket }}" \
            --exclude "assets/*" \
            --cache-control "no-cache" --delete
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.distribution }}" \
            --paths "/*"
